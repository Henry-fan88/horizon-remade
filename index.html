<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b12" />
    <meta name="description" content="Horizon Remade — an open-world festival racing game you can play in the browser, solo or online." />
    <title>HORIZON REMADE — Open World Festival Racing</title>
